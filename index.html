    <!-- 再案内が必要なリリースでは data-revision を変更する。 -->
    <dialog id="release-notice" data-revision="2026-10-15-1" aria-labelledby="release-notice-title" aria-describedby="release-notice-description">
      <form method="dialog">
        <header><h2 id="release-notice-title">Con-Sche 更新のお知らせ</h2></header>
        <section>
          <p id="release-notice-description">ご利用前に、画面を更新してください。</p>
          <p>古い情報が残っていると、画面が真っ白になる場合があります。以下の操作で、最新の画面を読み込んでください。</p>
          <dl><dt>Windows</dt><dd class="release-keys"><kbd>Ctrl</kbd><span>＋</span><kbd>Shift</kbd><span>＋</span><kbd>R</kbd></dd><dt>Mac</dt><dd class="release-keys"><kbd aria-label="Command">⌘</kbd><span>＋</span><kbd>Shift</kbd><span>＋</span><kbd>R</kbd></dd></dl>
          <label><input id="release-notice-hide" type="checkbox">今後表示しない</label>
          <small>今回の更新について、このブラウザーで非表示にします。次の案内更新時には再び表示します。</small>
        </section>
        <footer><button type="submit">確認しました</button></footer>
      </form>
    </dialog>
    <style>
      #release-notice { margin:auto; padding:0; width:min(480px,calc(100% - 32px)); max-height:calc(100% - 32px); border:0; border-radius:8px; background:#fff; color:#374151; font:14px/1.65 'Noto Sans JP','Hiragino Sans',sans-serif; box-shadow:0 20px 25px -5px #0003; }
      #release-notice::backdrop { background:#0008; }
      #release-notice header { padding:16px; border-bottom:1px solid #e5e7eb; }
      #release-notice h2 { margin:0; font-size:18px; font-weight:700; color:#111827; }
      #release-notice section { padding:16px; }
      #release-notice p { margin:0 0 16px; }
      #release-notice-description { font-weight:600; }
      #release-notice dl { display:grid; grid-template-columns:auto 1fr; align-items:center; gap:12px; padding:12px; margin:0 0 20px; background:#f9fafb; border-radius:4px; }
      #release-notice dd { margin:0; }
      #release-notice .release-keys { display:flex; align-items:center; gap:8px; }
      #release-notice .release-keys kbd:first-child { min-width:44px; }
      #release-notice kbd { display:inline-flex; align-items:center; justify-content:center; box-sizing:border-box; min-width:32px; height:28px; padding:0 7px; border:1px solid #9ca3af; border-bottom-width:3px; border-radius:4px; background:#fff; color:#111827; font:500 13px/1 system-ui,sans-serif; }
      #release-notice label { display:flex; align-items:center; gap:8px; cursor:pointer; }
      #release-notice input { width:16px; height:16px; accent-color:#2563eb; }
      #release-notice small { display:block; margin:6px 0 0 24px; font-size:12px; color:#6b7280; }
      #release-notice footer { padding:16px; display:flex; justify-content:flex-end; border-top:1px solid #e5e7eb; background:#f9fafb; }
      #release-notice button { padding:8px 16px; border:0; border-radius:6px; background:#2563eb; color:#fff; font:inherit; cursor:pointer; }
      #release-notice button:hover { background:#1d4ed8; }
      #release-notice :focus-visible { outline:2px solid #3b82f6; outline-offset:3px; }
    </style>
    <script>
      // アプリ本体が読み込めない場合も案内できるよう、モジュールに依存させない。
      (() => {
        const notice = document.getElementById('release-notice');
        const key = 'consche_release_notice_dismissed';
        const revision = notice.dataset.revision;
        const onceKey = key + ':confirmed-navigation';
        let destination = null;
        let hidden = false;
        try { hidden = localStorage.getItem(key) === revision; } catch {}
        notice.querySelector('form').addEventListener('submit', () => {
          if (document.getElementById('release-notice-hide').checked) {
            try { localStorage.setItem(key, revision); } catch {}
          }
          if (destination) {
            try { sessionStorage.setItem(onceKey, revision); } catch {}
            location.assign(destination);
          }
        });
        notice.addEventListener('close', () => { destination = null; });
        document.addEventListener('click', (event) => {
          if (event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
          const link = event.target instanceof Element ? event.target.closest('a[href]') : null;
          if (!link || link.hasAttribute('download') || (link.target && link.target !== '_self')) return;
          const url = new URL(link.href, location.href);
          if (url.origin !== location.origin || !/^\/app\/?$/.test(url.pathname)) return;
          try { if (localStorage.getItem(key) === revision) return; } catch {}
          event.preventDefault();
          event.stopImmediatePropagation();
          destination = url.href;
          notice.showModal();
        }, true);
        let confirmedNavigation = false;
        if (/^\/app\/?$/.test(location.pathname)) {
          try {
            confirmedNavigation = sessionStorage.getItem(onceKey) === revision;
            sessionStorage.removeItem(onceKey);
          } catch {}
          if (!hidden && !confirmedNavigation) notice.showModal();
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      起動の見張り役。ここだけは絶対にバンドルへ入れない（index.html に直接書く）。

      理由: デプロイでJSのファイル名が変わったあと、端末のキャッシュが一部だけ欠けると
      「古いHTMLが、もう存在しない古いJSを読みにいく」状態になり、本体が404で真っ白になる。
      本体が読めない以上、バンドル内の自動リロードもErrorBoundaryもエラー送信も一切動かない。
      利用者にはスーパーリロード以外の逃げ道がなくなる（2026-09-16 に再現確認）。

      この見張り役はHTMLの一部なので、本体が死んでいても必ず動く。ES5の範囲で書く
      （古い端末でも確実に動かすため。ここが動かないと最後の砦が無くなる）。
    -->
    <script>
      (function () {
        var FLAG = 'consche_boot_recover';
        // 現場は電波が薄いことがある（作業所・現場監督が使う前提）。
        // 「時間内に出ない＝壊れている」とは決めつけない。秒数をいくつにしても、
        // 真面目に読み込んでいる人をどこかで切ることになるため。
        var SLOW_NOTICE_MS = 8000;   // これを過ぎたら「読み込み中」を知らせる
        var GIVE_UP_MS = 30000;      // これを過ぎたら案内へ。復旧するかは利用者が決める
        var apiBase = '%VITE_API_BASE%';
        // 置換されなかった場合（env未設定）は同一オリジンに送る
        if (apiBase.charAt(0) === '%') apiBase = '';
        var done = false;

        /* isAppAsset:start */
        // 起動に必要なファイルかどうか。自サイトから配っているJS・CSSだけを対象にする。
        // 計測ビーコンのような外部配信のファイルは、広告ブロッカー等で落ちても
        // アプリの起動には関係ない（2026-09-19、これを起動失敗と誤判定して
        // 無事な利用者のキャッシュを消し、復旧案内まで見せてしまった）
        function isAppAsset(url, origin) {
          if (!url || !origin) return false;
          return url.indexOf(origin + '/') === 0;
        }
        /* isAppAsset:end */

        /* bootDecision:start */
        // 経過時間と画面の状態から、次にやることを決める。
        // 'ok' 起動できた / 'wait' まだ待つ / 'loading' 読み込み中を知らせる / 'giveup' 案内へ。
        // ここではキャッシュを消す判断をしない。遅いだけの利用者から持ち物を奪わないため
        function bootDecision(elapsedMs, hasContent, slowMs, giveUpMs) {
          if (hasContent) return 'ok';
          if (elapsedMs >= giveUpMs) return 'giveup';
          if (elapsedMs >= slowMs) return 'loading';
          return 'wait';
        }
        /* bootDecision:end */

        function swState() {
          try {
            if (!navigator.serviceWorker) return 'unsupported';
            var c = navigator.serviceWorker.controller;
            return c ? c.state : 'none';
          } catch (e) { return 'unknown'; }
        }

        function report(message) {
          try {
            if (location.protocol.indexOf('http') !== 0) return;
            fetch(apiBase + '/api/client-error', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              keepalive: true,
              body: JSON.stringify({
                message: message,
                source: 'boot',
                pageUrl: location.href,
                userAgent: navigator.userAgent,
                swState: swState()
              })
            })['catch'](function () {});
          } catch (e) {}
        }

        function hasContent() {
          var root = document.getElementById('root');
          return !!(root && root.children.length > 0);
        }

        // 読み込み中の知らせ。root ではなく body 直下に出す。
        // root に描くと「画面が出た」と誤認して起動判定が狂うため
        function showLoading() {
          if (document.getElementById('consche-loading')) return;
          var d = document.createElement('div');
          d.id = 'consche-loading';
          d.setAttribute('style',
            'position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;' +
            'justify-content:center;background:#fff;color:#334155;padding:24px;text-align:center;' +
            'font-family:system-ui,sans-serif');
          d.innerHTML =
            '<div><p style="margin:0 0 8px;font-size:15px">読み込み中です…</p>' +
            '<p style="margin:0;font-size:13px;line-height:1.7;color:#64748b">' +
            '電波が弱い場所では時間がかかることがあります。<br>' +
            'そのままお待ちください。</p></div>';
          document.body.appendChild(d);
        }

        function hideLoading() {
          var d = document.getElementById('consche-loading');
          if (d && d.parentNode) d.parentNode.removeChild(d);
        }

        function showFailureNotice() {
          hideLoading();
          var root = document.getElementById('root');
          if (!root || root.children.length > 0) return;
          root.innerHTML =
            '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;' +
            'font-family:system-ui,sans-serif;padding:24px;text-align:center;color:#334155">' +
            '<div><h1 style="font-size:18px;font-weight:700;margin:0 0 8px">読み込めませんでした</h1>' +
            '<p style="margin:0 0 16px;font-size:14px;line-height:1.7">' +
            'お使いの端末に残っていた古いデータが原因の可能性があります。<br>' +
            '下のボタンを押しても直らない場合は、お手数ですがブラウザを一度終了してから開き直してください。</p>' +
            '<button id="consche-retry" style="padding:10px 20px;background:#1e3a8a;color:#fff;border:0;' +
            'border-radius:8px;font-size:14px;cursor:pointer">データを消して再読み込み</button>' +
            '<p style="margin:16px 0 0;font-size:12px;color:#64748b">' +
            'それでも解決しない場合: ishikawa.yutaka@tatelog.biz</p></div></div>';
          var btn = document.getElementById('consche-retry');
          if (btn) {
            btn.onclick = function () {
              try { sessionStorage.removeItem(FLAG); } catch (e) {}
              cleanup(function () { location.reload(); });
            };
          }
        }

        /** Service Workerとキャッシュを消してから done を呼ぶ（失敗しても必ず進む） */
        function cleanup(done) {
          var steps = 2;
          var next = function () { if (--steps <= 0) done(); };
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                var left = regs.length;
                if (!left) return next();
                for (var i = 0; i < regs.length; i++) {
                  regs[i].unregister()['catch'](function () {}).then(function () {
                    if (--left <= 0) next();
                  });
                }
              })['catch'](next);
            } else { next(); }
          } catch (e) { next(); }
          try {
            if (window.caches && caches.keys) {
              caches.keys().then(function (keys) {
                var left = keys.length;
                if (!left) return next();
                for (var i = 0; i < keys.length; i++) {
                  caches['delete'](keys[i])['catch'](function () {}).then(function () {
                    if (--left <= 0) next();
                  });
                }
              })['catch'](next);
            } else { next(); }
          } catch (e) { next(); }
          // 消去が終わらなくても先に進む（永久に白いままにしない）
          setTimeout(done, 3000);
        }

        function recover(reason) {
          if (done) return;
          done = true;
          report(reason);
          var already;
          try { already = sessionStorage.getItem(FLAG); } catch (e) { already = null; }
          if (already) {
            // 1回やって直らなかった。無限リロードはせず、利用者に選択肢を見せる
            showFailureNotice();
            return;
          }
          try { sessionStorage.setItem(FLAG, '1'); } catch (e) {}
          cleanup(function () { location.reload(); });
        }

        // JS・CSSの読み込み失敗を拾う（バブルしないのでキャプチャで取る）
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (!t || t === window) return;
          var tag = t.tagName;
          if (tag !== 'SCRIPT' && tag !== 'LINK') return;
          var url = t.src || t.href || '';
          // 外部配信のファイル（計測ビーコン等）が落ちてもアプリは動く。
          // 名指しで除外する方式は配信元が増えるたびに漏れるので、自サイトのものだけ見る
          if (!isAppAsset(url, location.origin)) return;
          recover('起動に必要なファイルを読み込めませんでした: ' + url);
        }, true);

        // 読み込みは通ったが画面が出ない場合。
        // ここではキャッシュを消さない。遅いだけかもしれないし、現場では持っている
        // キャッシュこそが頼りだから（消すと6.9MBの読み直しになる）。
        // 知らせて待ち、それでも駄目なら選択肢を見せて利用者に決めてもらう
        var startedAt = Date.now();
        var watch = setInterval(function () {
          if (done) { clearInterval(watch); return; }
          var phase = bootDecision(Date.now() - startedAt, hasContent(), SLOW_NOTICE_MS, GIVE_UP_MS);
          if (phase === 'ok') {
            clearInterval(watch);
            hideLoading();
            try { sessionStorage.removeItem(FLAG); } catch (e) {}
            return;
          }
          if (phase === 'loading') {
            showLoading();
            return;
          }
          if (phase === 'giveup') {
            clearInterval(watch);
            done = true;
            report('アプリが起動しませんでした（画面が空のまま ' + GIVE_UP_MS + 'ms 経過）');
            showFailureNotice();
          }
        }, 500);
      })();
    </script>
