name = "con-sche-api"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# D1データベース（作成コマンド）:
#   wrangler d1 create con-sche-api
# 作成後、以下の database_id を実際のIDに差し替えること。
# スキーマ適用:
#   wrangler d1 execute con-sche-api --file=schema.sql --remote
[[d1_databases]]
binding = "DB"
database_name = "con-sche-api"
database_id = "af578008-3f83-43cf-a5d7-9d0dfa190dfe"

[vars]
# CORSで許可するオリジン（本番ドメインに合わせる。"*" は開発用）
ALLOWED_ORIGIN = "*"
# domain-gate Worker URL（スパムスコアリング。未設定 or 空文字ならチェックをスキップ）
DOMAIN_GATE_URL = "https://domain-gate.ishikawa-yutaka.workers.dev"
