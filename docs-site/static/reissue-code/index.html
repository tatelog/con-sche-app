<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>接続コードの表示 | Con-Sche</title>
<style>
  body { font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; margin: 0; background: #f1f5f9; color: #1e293b; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 48px 20px; }
  .card { background: #fff; border-radius: 12px; padding: 32px 28px; box-shadow: 0 1px 4px rgba(15, 23, 42, .08); }
  h1 { font-size: 1.25rem; margin: 0 0 8px; color: #1e3a8a; }
  p { line-height: 1.9; margin: 12px 0; font-size: .95rem; }
  .btn { display: block; width: 100%; box-sizing: border-box; text-align: center; background: #1e3a8a; color: #fff; border: none; font-weight: 700; padding: 14px 20px; border-radius: 8px; margin: 20px 0 8px; font-size: 1rem; cursor: pointer; font-family: inherit; }
  .btn:hover { background: #1d4ed8; }
  .btn:disabled { background: #94a3b8; cursor: default; }
  .logo { text-align: center; margin-bottom: 20px; font-weight: 900; color: #1e3a8a; font-size: 1.1rem; }
  .code-box { display: none; background: #0f172a; color: #86efac; font-family: Consolas, monospace; font-size: .95rem; padding: 16px; border-radius: 8px; overflow-wrap: anywhere; margin: 16px 0 8px; }
  .copy { background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 10px 16px; font-size: .9rem; cursor: pointer; color: #1e3a8a; font-weight: 700; width: 100%; font-family: inherit; }
  .copy.done { background: #dcfce7; border-color: #86efac; color: #166534; }
  .warn { background: #fef9c3; border: 1px solid #fde047; border-radius: 8px; padding: 12px 14px; font-size: .85rem; line-height: 1.7; margin-top: 16px; }
  .error { display: none; background: #fee2e2; border: 1px solid #fca5a5; border-radius: 8px; padding: 12px 14px; font-size: .9rem; line-height: 1.7; color: #991b1b; margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Con-Sche（コンスケ）</div>
  <div class="card">
    <h1>接続コードの表示</h1>
    <p>新しい接続コード（cs_live_...）を発行して表示します。</p>
    <p><strong>表示は1回きりです。</strong>表示されたら必ずコピーして、パスワード管理ツールやメモなど安全な場所に保管してください。</p>
    <button class="btn" id="show-btn">接続コードを表示する（1回だけ）</button>
    <div class="code-box" id="code-box"></div>
    <button class="copy" id="copy-btn" style="display:none">コードをコピー</button>
    <div class="warn" id="warn" style="display:none">
      このコードは二度と表示されません。今すぐコピーして保管してください。<br>
      ※これまでの古い接続コードは無効になりました。AIツール等に設定済みの場合は新しいコードに差し替えてください。
    </div>
    <div class="error" id="error"></div>
  </div>
</div>
<script>
var API = 'https://con-sche-api.ishikawa-yutaka.workers.dev/api/reissue/redeem';
var token = new URLSearchParams(location.search).get('token') || '';
var showBtn = document.getElementById('show-btn');
var codeBox = document.getElementById('code-box');
var copyBtn = document.getElementById('copy-btn');
var warn = document.getElementById('warn');
var errBox = document.getElementById('error');

function showError(msg) {
  errBox.textContent = msg;
  errBox.style.display = 'block';
  showBtn.disabled = true;
}

if (!token) {
  showError('リンクが正しくありません。メールに記載のURLをそのまま開いてください。');
}

showBtn.addEventListener('click', function () {
  showBtn.disabled = true;
  showBtn.textContent = '発行中...';
  fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: token })
  }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
    .then(function (res) {
      if (!res.ok) {
        showError(res.data.error || 'エラーが発生しました。もう一度お問い合わせください。');
        showBtn.textContent = '接続コードを表示する（1回だけ）';
        return;
      }
      codeBox.textContent = res.data.apiKey;
      codeBox.style.display = 'block';
      copyBtn.style.display = 'block';
      warn.style.display = 'block';
      showBtn.style.display = 'none';
    })
    .catch(function () {
      showError('通信エラーが発生しました。時間をおいて再度お試しください。');
      showBtn.disabled = false;
      showBtn.textContent = '接続コードを表示する（1回だけ）';
    });
});

copyBtn.addEventListener('click', function () {
  navigator.clipboard.writeText(codeBox.textContent).then(function () {
    copyBtn.textContent = 'コピーしました';
    copyBtn.classList.add('done');
    setTimeout(function () { copyBtn.textContent = 'コードをコピー'; copyBtn.classList.remove('done'); }, 2000);
  });
});
</script>
</body>
</html>
